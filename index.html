
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intern Lab Report Tracker</title>
    
    <!-- PWA & Mobile Optimization Meta Tags -->
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Report Tracker">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063176.png">

    <!-- Inline Web App Manifest Data URI -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Intern Lab Report Tracker","short_name":"Report Tracker","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#10b981","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3063/3063176.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .active-touch:active {
            transform: scale(0.97);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200 pb-12">

    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-2.5 shadow-sm">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-emerald-500 text-white rounded-xl shadow-sm">
                    <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight flex items-center gap-1.5">
                        Report Tracker
                        <span id="pwaStatusBadge" class="text-[10px] px-1.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 font-medium">PWA Ready</span>
                    </h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-1">
                        <span id="networkIndicator" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span id="networkText">Online</span>
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5">
                <!-- Install App Button (Shows when browser fires install prompt) -->
                <button id="installPwaBtn" class="hidden px-2.5 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold flex items-center gap-1 active-touch shadow-sm">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span>Install</span>
                </button>

                <button id="manageTestsBtn" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-xs flex items-center gap-1 font-medium transition active-touch" title="Manage Dropdown Options">
                    <i data-lucide="settings-2" class="w-4 h-4"></i>
                </button>
                
                <button id="themeToggleBtn" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition active-touch" aria-label="Toggle Theme">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

        <!-- Add Patient Entry Card -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-3">
            <div class="flex items-center justify-between pb-1 border-b border-slate-100 dark:border-slate-700/50">
                <h2 class="text-sm font-semibold flex items-center gap-1.5 text-slate-700 dark:text-slate-200">
                    <i data-lucide="user-plus" class="w-4 h-4 text-emerald-500"></i>
                    Add Patient Entry
                </h2>
                <span class="text-[11px] text-slate-400">Fast Mode</span>
            </div>

            <form id="addPatientForm" class="space-y-3">
                <!-- Main Patient Name Input & Expand Button -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400">Patient Name*</label>
                        <button type="button" id="toggleExtraFieldsBtn" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium flex items-center gap-1 hover:underline active-touch">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Bed / CR No.
                        </button>
                    </div>
                    <input type="text" id="patientName" required placeholder="e.g. Ramesh Kumar" 
                        class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-white">
                </div>

                <!-- Hidden by default: Collapsible Bed No. & CR No. -->
                <div id="extraFieldsContainer" class="grid grid-cols-2 gap-2.5 hidden pt-1 border-t border-dashed border-slate-200 dark:border-slate-700">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Bed No. / Ward</label>
                        <input type="text" id="bedNo" placeholder="e.g. Bed 12 / W3" 
                            class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">CR / Reg No.</label>
                        <input type="text" id="crNo" placeholder="e.g. 2026-8492" 
                            class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-white">
                    </div>
                </div>

                <!-- Test Selection with Quick Action Chips -->
                <div>
                    <div class="flex items-center justify-between mb-1.5 flex-wrap gap-1">
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400">Investigations Required*</label>
                        <!-- Super Fast One-Tap Quick Chips -->
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] text-slate-400 font-medium mr-0.5">Quick:</span>
                            <button type="button" onclick="quickAddTest('CBC')" class="px-2 py-0.5 text-xs font-semibold bg-emerald-100 hover:bg-emerald-200 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 dark:hover:bg-emerald-900 rounded-lg border border-emerald-300 dark:border-emerald-800 transition active-touch flex items-center gap-0.5">+ CBC</button>
                            <button type="button" onclick="quickAddTest('BUSE')" class="px-2 py-0.5 text-xs font-semibold bg-emerald-100 hover:bg-emerald-200 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 dark:hover:bg-emerald-900 rounded-lg border border-emerald-300 dark:border-emerald-800 transition active-touch flex items-center gap-0.5">+ BUSE</button>
                            <button type="button" onclick="quickAddTest('PT/INR')" class="px-2 py-0.5 text-xs font-semibold bg-emerald-100 hover:bg-emerald-200 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 dark:hover:bg-emerald-900 rounded-lg border border-emerald-300 dark:border-emerald-800 transition active-touch flex items-center gap-0.5">+ PT/INR</button>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <select id="testDropdown" class="flex-1 px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-white cursor-pointer">
                                <option value="" disabled selected>-- Select test from dropdown --</option>
                            </select>
                        </div>

                        <!-- Free text add input -->
                        <div class="flex gap-2">
                            <input type="text" id="customTestInput" placeholder="Or type test name (e.g. Troponin, CT Head)" 
                                class="flex-1 px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-white">
                            <button type="button" id="addTestChipBtn" class="px-3.5 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl text-xs font-semibold flex items-center gap-1 active-touch transition">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
                            </button>
                        </div>
                    </div>

                    <!-- Selected Tests Chips Container -->
                    <div id="selectedTestsContainer" class="flex flex-wrap gap-1.5 mt-2.5 min-h-[32px] p-2 bg-slate-50 dark:bg-slate-900/50 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl">
                        <span id="noTestsPlaceholder" class="text-xs text-slate-400 italic">No tests added yet</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 active-touch transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Add to Collection List
                </button>
            </form>
        </section>

        <section class="space-y-2">
            <!-- Search & Filter Row -->
            <div class="flex flex-col sm:flex-row gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search name, CR, bed, or test..." 
                        class="w-full pl-9 pr-3 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:text-white">
                </div>
                <div class="flex gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                    <button data-filter="all" class="filter-btn active-filter px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 shadow-sm transition">All</button>
                    <button data-filter="Awaited" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 border border-slate-200 dark:border-slate-700 hover:bg-amber-50 dark:hover:bg-amber-950/30 transition">Awaited</button>
                    <button data-filter="Collected" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 border border-slate-200 dark:border-slate-700 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 transition">Collected</button>
                    <button data-filter="No Entry" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-800 text-rose-600 dark:text-rose-400 border border-slate-200 dark:border-slate-700 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition">No Entry</button>
                </div>
            </div>

            <!-- WhatsApp Export & Batch Clean Action Toolbar -->
            <div class="flex items-center justify-between gap-2 pt-1">
                <button id="copyHandoverBtn" class="px-3 py-1.5 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 rounded-xl text-xs font-semibold flex items-center gap-1.5 hover:bg-emerald-200 dark:hover:bg-emerald-900 active-touch transition">
                    <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Copy WhatsApp Handover
                </button>

                <button id="clearCompletedBtn" class="text-xs text-slate-500 hover:text-rose-600 dark:hover:text-rose-400 flex items-center gap-1 transition px-2 py-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear Collected
                </button>
            </div>
        </section>

        <!-- Task List Area -->
        <section id="taskList" class="space-y-3">
            <!-- Dynamically populated cards will appear here -->
        </section>

        <!-- Empty State View -->
        <div id="emptyState" class="hidden py-12 text-center space-y-3 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
            <div class="w-12 h-12 mx-auto rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-400">
                <i data-lucide="check-circle-2" class="w-6 h-6"></i>
            </div>
            <div>
                <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">No report tasks found</p>
                <p class="text-xs text-slate-400 max-w-xs mx-auto mt-1">Add a patient entry above or try changing active filters.</p>
            </div>
        </div>

    </main>

    <!-- Modal 1: Test Manager Modal -->
    <div id="testManagerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i data-lucide="list-checks" class="w-4 h-4 text-emerald-500"></i> Manage Dropdown Tests
                </h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-4 space-y-4 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Add Custom Test to Dropdown</label>
                    <div class="flex gap-2">
                        <input type="text" id="newMasterTestInput" placeholder="e.g. Procalcitonin" 
                            class="flex-1 px-3 py-2 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:text-white">
                        <button id="addMasterTestBtn" class="px-3 py-2 bg-emerald-600 text-white rounded-xl text-xs font-medium hover:bg-emerald-700 active-touch transition flex items-center gap-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
                        </button>
                    </div>
                </div>

                <hr class="border-slate-100 dark:border-slate-700">

                <div class="space-y-1">
                    <label class="block text-xs font-medium text-slate-500 mb-2">Dropdown Options (<span id="masterTestCount">0</span>)</label>
                    <div id="masterTestListContainer" class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <div class="p-3 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700 text-right">
                <button id="resetDefaultTestsBtn" class="text-xs text-rose-500 hover:text-rose-600 underline mr-auto float-left py-1">Reset Defaults</button>
                <button id="doneModalBtn" class="px-4 py-1.5 bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 rounded-xl text-xs font-medium hover:opacity-90">Done</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Edit Task Modal -->
    <div id="editTaskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i data-lucide="pencil" class="w-4 h-4 text-emerald-500"></i> Edit Patient Task
                </h3>
                <button id="closeEditModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="editTaskForm" class="p-4 space-y-3">
                <input type="hidden" id="editTaskId">
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Patient Name</label>
                    <input type="text" id="editPatientName" required class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl dark:text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Bed No.</label>
                        <input type="text" id="editBedNo" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">CR No.</label>
                        <input type="text" id="editCrNo" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl dark:text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Tests (Comma Separated)</label>
                    <input type="text" id="editTestsString" required class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl dark:text-white">
                </div>

                <div class="pt-2 text-right flex justify-end gap-2">
                    <button type="button" id="cancelEditBtn" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-medium">Cancel</button>
                    <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-medium hover:bg-emerald-700">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-full text-xs font-medium shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMsg">Notification message</span>
    </div>

    <script>
        // --- DEFAULT MASTER INVESTIGATIONS ---
        const DEFAULT_TESTS = [
            "CBC", "BUSE", "LFT", "KFT", "PT/INR", "ABG", 
            "Urine RM", "Chest X-Ray", "CT Scan", "MRI", 
            "Ultrasound", "Blood Culture", "Electrolytes", 
            "Troponin", "ECG"
        ];

        const STATUS_TYPES = {
        // DOM ELEMENTS
        const toggleExtraFieldsBtn = document.getElementById('toggleExtraFieldsBtn');
        const extraFieldsContainer = document.getElementById('extraFieldsContainer');

            COLLECTED: 'Collected',
        // Toggle Bed No. and CR No. Visibility
        toggleExtraFieldsBtn.addEventListener('click', () => {
            const isHidden = extraFieldsContainer.classList.contains('hidden');
            if (isHidden) {
                extraFieldsContainer.classList.remove('hidden');
                toggleExtraFieldsBtn.innerHTML = `<i data-lucide="minus" class="w-3.5 h-3.5"></i> Hide Bed / CR No.`;
            } else {
                extraFieldsContainer.classList.add('hidden');
                toggleExtraFieldsBtn.innerHTML = `<i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Bed / CR No.`;
            }
            lucide.createIcons();
        });

        // Fast Quick-Tap Chip Handler
        window.quickAddTest = function(testName) {
            if (!selectedFormTests.includes(testName)) {
                selectedFormTests.push(testName);
                renderFormChips();
            }
        };

        window.deleteMasterTest = function(index) {
        // Submit Patient Form
        addPatientForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = patientNameInput.value.trim();
            const cr = crNoInput.value.trim();
            const bed = bedNoInput.value.trim();

            if (selectedFormTests.length === 0) {
                showToast('Please select or tap at least one test.');
                return;
            }

            const newTask = {
                id: Date.now().toString(),
                patientName: name,
                crNo: cr || 'N/A',
                bedNo: bed || 'N/A',
                tests: [...selectedFormTests],
                status: STATUS_TYPES.AWAITED,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            tasks.unshift(newTask);
            saveTasks();

            addPatientForm.reset();
            selectedFormTests = [];
            
            // Auto collapse extra fields after save for fast next entry
            extraFieldsContainer.classList.add('hidden');
            toggleExtraFieldsBtn.innerHTML = `<i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Bed / CR No.`;

            renderFormChips();
            renderTaskList();

            showToast('Patient added to collection list');
        });

        function saveTasks() {
            localStorage.setItem('intern_tasks', JSON.stringify(tasks));
        }

        function renderTaskList() {
            taskListContainer.innerHTML = '';

            const filteredTasks = tasks.filter(task => {
                const matchesFilter = (currentFilter === 'all') || (task.status === currentFilter);
                const query = searchQuery.toLowerCase();
                const matchesSearch = task.patientName.toLowerCase().includes(query) ||
                                      task.crNo.toLowerCase().includes(query) ||
                                      task.bedNo.toLowerCase().includes(query) ||
                                      task.tests.some(t => t.toLowerCase().includes(query));
                return matchesFilter && matchesSearch;
            });

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredTasks.forEach(task => {
                const card = document.createElement('div');
                
                let statusBgClass = '';
                let statusBadgeClass = '';
                
                if (task.status === STATUS_TYPES.AWAITED) {
                    statusBgClass = 'border-l-4 border-l-amber-500 bg-white dark:bg-slate-800';
                    statusBadgeClass = 'bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border-amber-200 dark:border-amber-800';
                } else if (task.status === STATUS_TYPES.COLLECTED) {
                    statusBgClass = 'border-l-4 border-l-emerald-500 bg-emerald-50/30 dark:bg-slate-800/60 opacity-80';
                    statusBadgeClass = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
                } else if (task.status === STATUS_TYPES.NO_ENTRY) {
                    statusBgClass = 'border-l-4 border-l-rose-500 bg-rose-50/20 dark:bg-slate-800';
                    statusBadgeClass = 'bg-rose-100 text-rose-800 dark:bg-rose-950/80 dark:text-rose-300 border-rose-200 dark:border-rose-800';
                }

                card.className = `${statusBgClass} rounded-2xl p-3.5 shadow-sm border border-slate-200/80 dark:border-slate-700/80 transition space-y-3`;

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 ${task.status === STATUS_TYPES.COLLECTED ? 'line-through text-slate-500' : ''}">${escapeHtml(task.patientName)}</h3>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${statusBadgeClass} border">
                                    ${task.status}
                                </span>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                <span><strong class="font-medium">Bed:</strong> ${escapeHtml(task.bedNo)}</span>
                                <span>•</span>
                                <span><strong class="font-medium">CR:</strong> ${escapeHtml(task.crNo)}</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-1">
                            <button onclick="openEditModal('${task.id}')" class="p-1 text-slate-400 hover:text-emerald-600 transition" title="Edit Entry">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition" title="Delete Task">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Tests Badges -->
                    <div class="flex flex-wrap gap-1.5">
                        ${task.tests.map(test => `
                            <span class="px-2 py-0.5 bg-slate-100 dark:bg-slate-700/60 text-slate-700 dark:text-slate-300 text-xs font-medium rounded-md border border-slate-200/60 dark:border-slate-600/60">
                                ${escapeHtml(test)}
                            </span>
                        `).join('')}
                    </div>

                    <!-- Instant Status Toggle Row -->
                    <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-1">
                        <span class="text-[11px] font-medium text-slate-400">Status:</span>
                        <div class="flex items-center gap-1">
                            <button onclick="updateTaskStatus('${task.id}', '${STATUS_TYPES.AWAITED}')" 
                                class="px-2.5 py-1 text-xs font-medium rounded-xl transition flex items-center gap-1 active-touch ${
                                    task.status === STATUS_TYPES.AWAITED 
                                    ? 'bg-amber-500 text-white shadow-sm font-semibold' 
                                    : 'bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 hover:bg-amber-100 dark:hover:bg-amber-950/40'
                                }">
                                <i data-lucide="clock" class="w-3 h-3"></i> Awaited
                            </button>

                            <button onclick="updateTaskStatus('${task.id}', '${STATUS_TYPES.COLLECTED}')" 
                                class="px-2.5 py-1 text-xs font-medium rounded-xl transition flex items-center gap-1 active-touch ${
                                    task.status === STATUS_TYPES.COLLECTED 
                                    ? 'bg-emerald-600 text-white shadow-sm font-semibold' 
                                    : 'bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 hover:bg-emerald-100 dark:hover:bg-emerald-950/40'
                                }">
                                <i data-lucide="check-circle" class="w-3 h-3"></i> Collected
                            </button>

                            <button onclick="updateTaskStatus('${task.id}', '${STATUS_TYPES.NO_ENTRY}')" 
                                class="px-2.5 py-1 text-xs font-medium rounded-xl transition flex items-center gap-1 active-touch ${
                                    task.status === STATUS_TYPES.NO_ENTRY 
                                    ? 'bg-rose-600 text-white shadow-sm font-semibold' 
                                    : 'bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 hover:bg-rose-100 dark:hover:bg-rose-950/40'
                                }">
                                <i data-lucide="alert-circle" class="w-3 h-3"></i> No Entry
                            </button>
                        </div>
                    </div>
                `;

                taskListContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        window.updateTaskStatus = function(taskId, newStatus) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.status = newStatus;
                saveTasks();
                renderTaskList();
                showToast(`Status updated: ${newStatus}`);
            }
        };

        window.deleteTask = function(taskId) {
            tasks = tasks.filter(t => t.id !== taskId);
            saveTasks();
            renderTaskList();
            showToast('Task removed');
        };

        // Modal 2 Editing Logic
        window.openEditModal = function(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            editTaskId.value = task.id;
            editPatientName.value = task.patientName;
            editBedNo.value = task.bedNo;
            editCrNo.value = task.crNo;
            editTestsString.value = task.tests.join(', ');

            editTaskModal.classList.remove('hidden');
        };

        editTaskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = editTaskId.value;
            const task = tasks.find(t => t.id === id);

            if (task) {
                task.patientName = editPatientName.value.trim();
                task.bedNo = editBedNo.value.trim() || 'N/A';
                task.crNo = editCrNo.value.trim() || 'N/A';
                task.tests = editTestsString.value.split(',').map(s => s.trim()).filter(s => s.length > 0);

                saveTasks();
                renderTaskList();
                editTaskModal.classList.add('hidden');
                showToast('Entry updated');
            }
        });

        closeEditModalBtn.addEventListener('click', () => editTaskModal.classList.add('hidden'));
        cancelEditBtn.addEventListener('click', () => editTaskModal.classList.add('hidden'));

        clearCompletedBtn.addEventListener('click', () => {
            const collectedCount = tasks.filter(t => t.status === STATUS_TYPES.COLLECTED).length;
            if (collectedCount === 0) {
                showToast('No collected tasks to clear');
                return;
            }
            tasks = tasks.filter(t => t.status !== STATUS_TYPES.COLLECTED);
            saveTasks();
            renderTaskList();
            showToast('Collected tasks cleared');
        });

        // Filter Buttons Logic
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('active-filter', 'bg-slate-800', 'text-white', 'dark:bg-slate-100', 'dark:text-slate-900');
                    b.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
                });

                btn.classList.add('active-filter', 'bg-slate-800', 'text-white', 'dark:bg-slate-100', 'dark:text-slate-900');
                btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');

                currentFilter = btn.getAttribute('data-filter');
                renderTaskList();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderTaskList();
        });

        // WhatsApp Handover Formatter
        copyHandoverBtn.addEventListener('click', () => {
            if (tasks.length === 0) {
                showToast('No tasks in current list');
                return;
            }

            const today = new Date().toLocaleDateString([], { month: 'short', day: 'numeric' });
            let text = `📋 *LAB / RADIOLOGY REPORT HANDOVER* (${today})\n`;
            text += `------------------------------------\n\n`;

            const awaitedTasks = tasks.filter(t => t.status === STATUS_TYPES.AWAITED);
            const noEntryTasks = tasks.filter(t => t.status === STATUS_TYPES.NO_ENTRY);
            const collectedTasks = tasks.filter(t => t.status === STATUS_TYPES.COLLECTED);

            if (awaitedTasks.length > 0) {
                text += `🟡 *REPORTS AWAITED (${awaitedTasks.length}):*\n`;
                awaitedTasks.forEach(t => {
                    text += `• *${t.patientName}* (Bed: ${t.bedNo} | CR: ${t.crNo}): ${t.tests.join(', ')}\n`;
                });
                text += `\n`;
            }

            if (noEntryTasks.length > 0) {
                text += `🔴 *NO ENTRY / SAMPLE REJECTED (${noEntryTasks.length}):*\n`;
                noEntryTasks.forEach(t => {
                    text += `• *${t.patientName}* (Bed: ${t.bedNo}): ${t.tests.join(', ')}\n`;
                });
                text += `\n`;
            }

            if (collectedTasks.length > 0) {
                text += `🟢 *COLLECTED (${collectedTasks.length}):*\n`;
                collectedTasks.forEach(t => {
                    text += `• *${t.patientName}* (Bed: ${t.bedNo}): ${t.tests.join(', ')}\n`;
                });
                text += `\n`;
            }

            text += `------------------------------------\n`;
            text += `_Sent via Intern Report Tracker_`;

            copyToClipboard(text);
        });

        function copyToClipboard(str) {
            const el = document.createElement('textarea');
            el.value = str;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            try {
                document.execCommand('copy');
                showToast('Handover copied! Ready to paste in WhatsApp');
            } catch (err) {
                showToast('Failed to copy');
            }
            document.body.removeChild(el);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
